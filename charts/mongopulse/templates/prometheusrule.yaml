{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "mongopulse.fullname" . }}
  labels:
    {{- include "mongopulse.labels" . | nindent 4 }}
spec:
  groups:
    - name: mongopulse
      rules:
        {{- toYaml .Values.prometheusRule.rules | nindent 8 }}
{{- end }}
